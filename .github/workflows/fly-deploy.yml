name: Deploy to Fly.io

# Deploys the combined app (API + frontend, one image) on every push to main,
# once FLY_API_TOKEN is set (repo Settings → Secrets and variables → Actions).
# One-time setup is documented in DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: cd backend && PYTHONPATH=. pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check frontend
        run: cd frontend && npm ci && npm run type-check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fail fast if FLY_API_TOKEN secret is missing
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::No Fly token found. Add a repo Actions secret named FLY_API_TOKEN (or ORG) containing your Fly org token."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.ORG || secrets.FLY_ORG || secrets.ORG_TOKEN || secrets.FLY_ORG_TOKEN }}
      # Durable track record: provision the ledger volume and migrate the
      # machine onto it. Fly can't attach a volume to an already-running
      # machine in place, so a volume-less machine is destroyed and the deploy
      # below recreates it WITH the mount (brief blip on that one deploy only).
      # Idempotent: once the machine already has the mount, nothing is destroyed.
      - name: Ensure ledger volume + migrate machine
        run: |
          set -e
          if ! flyctl volumes list --app statedge-api --json | jq -e '.[] | select(.name=="statedge_data" and .state!="destroyed")' >/dev/null 2>&1; then
            echo "Creating statedge_data volume in dfw..."
            flyctl volumes create statedge_data --app statedge-api --region dfw --size 1 --yes
          else
            echo "Volume statedge_data already present."
          fi
          volumeless=$(flyctl machines list --app statedge-api --json | jq '[.[] | select((.config.mounts // []) | length == 0)] | length')
          if [ "${volumeless:-0}" -gt 0 ]; then
            echo "Migrating ${volumeless} volume-less machine(s) onto the volume..."
            for id in $(flyctl machines list --app statedge-api --json | jq -r '.[] | select((.config.mounts // []) | length == 0) | .id'); do
              echo "  destroying machine ${id}"
              flyctl machine destroy "$id" --force || true
            done
          else
            echo "All machines already mounted; no migration needed."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.ORG || secrets.FLY_ORG || secrets.ORG_TOKEN || secrets.FLY_ORG_TOKEN }}
      - name: Deploy combined app
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.ORG || secrets.FLY_ORG || secrets.ORG_TOKEN || secrets.FLY_ORG_TOKEN }}
