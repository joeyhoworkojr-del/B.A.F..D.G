name: Deploy to Fly.io

# Deploys the combined app (API + frontend, one image) on every push to main,
# once FLY_API_TOKEN is set (repo Settings → Secrets and variables → Actions).
# One-time setup is documented in DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: cd backend && PYTHONPATH=. pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check frontend
        run: cd frontend && npm ci && npm run type-check
      - name: Frontend unit tests
        run: cd frontend && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fail fast if FLY_API_TOKEN secret is missing
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::No Fly token found. Add a repo Actions secret named FLY_API_TOKEN (or ORG) containing your Fly org token."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.ORG || secrets.FLY_ORG || secrets.ORG_TOKEN || secrets.FLY_ORG_TOKEN }}
      - name: Deploy combined app
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.ORG || secrets.FLY_ORG || secrets.ORG_TOKEN || secrets.FLY_ORG_TOKEN }}

      # Which optional keys the running app can actually see, reported after
      # every deploy. The endpoints below return names and booleans only — no
      # credential value is ever in their output, which is what makes it safe
      # to print in a build log.
      #
      # This exists because neither of us can check otherwise: the assistant's
      # sandbox cannot reach the API host, and reading a JSON blob by hand is a
      # poor way to find out that a key was pasted with a stray quote on it.
      - name: Report which optional keys are live
        continue-on-error: true          # never fail a good deploy over a report
        run: |
          sleep 15   # let the new machine finish starting
          # tee, not >>: the step summary is not readable from the API, so a
          # report that only lands there cannot answer "is the college feed
          # actually working" for anyone who is not clicking through the web UI.
          echo "### Optional integrations" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"

          ai=$(curl -sS --max-time 20 https://statedge-api.fly.dev/api/v1/ai/status || echo '{}')
          sources=$(curl -sS --max-time 20 https://statedge-api.fly.dev/api/v1/data/sources || echo '{}')

          python3 - "$ai" "$sources" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys

          def load(raw):
              try:
                  return json.loads(raw)
              except Exception:
                  return {}

          ai, sources = load(sys.argv[1]), load(sys.argv[2])

          print("| Integration | Configured | Working | Note |")
          print("| --- | --- | --- | --- |")

          def row(name, configured, working, note):
              tick = lambda v: "yes" if v else "no"
              print(f"| {name} | {tick(configured)} | {tick(working)} | {note} |")

          budget = ai.get("budget") or {}
          row(
              "Edge AI (ANTHROPIC_API_KEY)",
              ai.get("available") is not None and ai.get("model"),
              ai.get("available"),
              # The provider's own last failure first: when Edge AI is
              # refusing to answer, that sentence is the whole diagnosis, and
              # "sign in to ask" — all an unauthenticated probe can otherwise
              # report — is not.
              ai.get("last_error") or ai.get("reason")
              or f"${budget.get('remaining_usd', '?')} of "
                                  f"${budget.get('daily_limit_usd', '?')} left today",
          )

          for provider in sources.get("providers") or []:
              if not provider.get("requires_key"):
                  continue
              row(
                  f"{provider.get('provider')} ({provider.get('key_env_var')})",
                  provider.get("configured"),
                  # Configured means a key is present. Only a successful fetch
                  # means it works — a rejected key looks identical otherwise.
                  bool(provider.get("last_success")),
                  provider.get("last_error") or provider.get("note") or "ok",
              )

          if not ai and not sources:
              print("")
              print("The API did not answer in time. Not necessarily broken — "
                    "check the endpoints directly.")
          PY
