# Fly.io config for StatEdge — single app: API + frontend in one image.
# Deploy: fly deploy  (from the repo root)
# If the app name is taken, `fly apps create <name>` and update `app` below.

app = "statedge-api"
primary_region = "dfw"   # Dallas — closest to the World Cup action

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  LOG_LEVEL = "INFO"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  MONTE_CARLO_SIMS = "50000"
  ELO_MU = "1.35"
  ELO_Q = "1200"
  ELO_HOST_EDGE = "150"
  SR_BLEND_WEIGHT = "0.60"
  # Durable track record (persistent ledger) is TEMPORARILY OFF: the dfw host
  # holding the `statedge_data` volume ran out of capacity to launch a machine
  # ("insufficient resources to create new machine with existing volume"),
  # which took the app down mid-migration. Mount reverted to restore service.
  # To retry: create a FRESH empty volume in a region with capacity, then
  # re-enable the LEDGER_PATH + [[mounts]] below. See DEPLOYMENT.md.
  # LEDGER_PATH = "/data/ledger.db"

# [[mounts]]
#   source = "statedge_data"
#   destination = "/data"

# Secrets (set via: fly secrets set KEY=value --app statedge-api)
# Optional: DATABASE_URL, REDIS_URL, FOOTBALL_DATA_API_KEY, SPORTRADAR_API_KEY

[[services]]
  protocol = "tcp"
  internal_port = 8000
  # Auto-stop is off deliberately. A stopped machine cold-starts on the next
  # request, and a cold start here pays for the nflverse warm-up and an empty
  # response cache — which is a slow page for whoever happened to arrive
  # first. On a site people open at kickoff, that is most of them.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  # Two cores and a gigabyte. The feeds behind the model are measured in
  # megabytes and several can be in flight at once; 512 MB left no headroom
  # for a burst on top of them, and one core serialised work that is mostly
  # waiting on I/O anyway.
  cpus = 2
  memory_mb = 1024
